name: NIGHT CALENDAR One-Time APK Release
# Single-use, runner-generated key: updates cannot be installed over this build.
# Runs PR QA with read-only permissions; publishes only on a reviewed main push.
on:
  pull_request:
    paths:
      - '.github/workflows/oneoff-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-release.yml'

permissions:
  contents: read

jobs:
  signed_apk_qa:
    name: Build, sign with throwaway key, verify, and Android 16 smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Run release unit tests, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Make one-time certificate and sign APK (never store key)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/night-calendar-oneoff.jks"
          trap 'rm -f "$key"' EXIT
          export KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export KEY_ALIAS="night-calendar-oneoff"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$key" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 36500 -dname "CN=NIGHT CALENDAR One-Off Build" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD"
          export KEYSTORE_B64="$(base64 -w0 "$key")"
          export EXPECTED_CERT_SHA256="$(keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$key" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)"
          bash scripts/sign_release_candidate.sh
          unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_PASSWORD
          rm -f "$key"
          test -s signed-candidate/NIGHT_CALENDAR_candidate.apk
          (cd signed-candidate && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            signed-candidate/NIGHT_CALENDAR_candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            signed-candidate/NIGHT_CALENDAR_candidate.apk | grep -F \
            "package: name='com.nightcalendar' versionCode='1' versionName='0.1.0'"
          echo "NIGHT CALENDAR one-off APK signed, hash checked and package verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Android 16 emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Test exact distributable APK on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          script: bash scripts/release_emulator_smoke.sh
      - name: Keep verified APK and checksum for release job
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT_CALENDAR_v0.1.0_oneoff
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14

  publish_once:
    name: Publish one-off GitHub Release only after signed APK QA passes
    needs: signed_apk_qa
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'kurenn46-max/night-calendar-'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Enforce single-use release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists. No overwrite allowed."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo "::error::Tag already exists. No overwrite allowed."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: NIGHT_CALENDAR_v0.1.0_oneoff
          path: signed-candidate/
      - name: Recheck exact artifact bytes and signer before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s signed-candidate/NIGHT_CALENDAR_candidate.apk
          (cd signed-candidate && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 signed-candidate/NIGHT_CALENDAR_candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging signed-candidate/NIGHT_CALENDAR_candidate.apk | grep -F \
            "package: name='com.nightcalendar' versionCode='1' versionName='0.1.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed-candidate/NIGHT_CALENDAR_candidate.apk | grep -F 'Signer #1 certificate SHA-256 digest:'
          mkdir -p publish
          cp signed-candidate/NIGHT_CALENDAR_candidate.apk publish/NIGHT_CALENDAR_v0.1.0.apk
          (cd publish && sha256sum NIGHT_CALENDAR_v0.1.0.apk > SHA256SUMS.txt)
      - name: Publish one-off installable APK (no private key retained)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/oneoff-notes.md" <<EOF
          NIGHT CALENDAR v0.1.0 — standalone Android APK (one-time signed build).

          - Japanese month-view with 六曜 (2025–2027) and Japanese holidays (2026–2027).
          - Displays events from Android calendars already synced to the device, with user-granted read permission.
          - Opens Android calendar app for event creation and viewing/editing.
          - Dark/light display, on-device-only diagnostics, no ads or subscription.

          IMPORTANT: This APK was signed with a throwaway key generated for this GitHub Actions run.
          The private key was NOT preserved, so future APKs cannot replace this installation in place.
          If a replacement is ever needed, uninstall the old app before installing the new one.
          Calendar events synced to Android remain with the Android calendar provider, but
          app-specific settings may be lost on uninstall.

          QA: release-variant APK installed, UI checked and relaunched on Android 16 emulator.
          Earlier QA build was installed on owner's physical phone and read synced calendar events;
          this exact new signed APK still needs owner physical-device acceptance after download.

          Source commit: ${GITHUB_SHA}
          Signed artifact and UI QA run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create v0.1.0 publish/NIGHT_CALENDAR_v0.1.0.apk publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NIGHT CALENDAR v0.1.0 — One-time Android APK" \
            --notes-file "$RUNNER_TEMP/oneoff-notes.md" --latest
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/v0.1.0" >> "$GITHUB_STEP_SUMMARY"
