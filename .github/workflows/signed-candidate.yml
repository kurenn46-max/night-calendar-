name: NIGHT CALENDAR Signed Candidate (manual, not public release)
on:
  pull_request:
    paths:
      - '.github/workflows/signed-candidate.yml'
      - 'scripts/test_signed_candidate_gate.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check offline signing policy
        run: python3 -m unittest discover -s scripts -p 'test_signed_candidate_gate.py' -v

  sign_candidate:
    name: Sign candidate APK but do not publish
    if: github.event_name == 'workflow_dispatch'
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require owner-managed signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIGHT_CALENDAR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIGHT_CALENDAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIGHT_CALENDAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIGHT_CALENDAR_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.NIGHT_CALENDAR_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing setting missing: $name"
              exit 1
            fi
          done
          if ! [[ "$EXPECTED_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){31}[[:xdigit:]]{2}$ ]]; then
            echo "::error::Invalid expected signing certificate fingerprint"
            exit 1
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and check release candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Sign, validate certificate and package identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIGHT_CALENDAR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIGHT_CALENDAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIGHT_CALENDAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIGHT_CALENDAR_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.NIGHT_CALENDAR_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/night-calendar-signing" signed-candidate
          chmod 700 "$RUNNER_TEMP/night-calendar-signing"
          keystore="$RUNNER_TEMP/night-calendar-signing/release.keystore"
          trap 'rm -f "$keystore" "$RUNNER_TEMP/night-calendar-signing/aligned.apk"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools_dir="$ANDROID_HOME/build-tools/35.0.0"
          "$tools_dir/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/night-calendar-signing/aligned.apk"
          output="signed-candidate/NIGHT_CALENDAR_candidate.apk"
          "$tools_dir/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$output" "$RUNNER_TEMP/night-calendar-signing/aligned.apk"
          "$tools_dir/apksigner" verify --verbose "$output"
          "$tools_dir/zipalign" -c -v 4 "$output"
          actual="$("$tools_dir/apksigner" verify --print-certs "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "${#actual}" -ne 64 ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate fingerprint mismatch"
            rm -f "$output"
            exit 1
          fi
          "$tools_dir/aapt" dump badging "$output" | grep -F "package: name='com.nightcalendar'" >/dev/null
          sha256sum "$output" > signed-candidate/SHA256SUMS.txt
          echo "Signed release candidate verified; manual on-device approval is still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Store verified candidate without publishing a release
        uses: actions/upload-artifact@v4
        with:
          name: night-calendar-signed-candidate
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14
