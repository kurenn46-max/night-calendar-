name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Pin to the tested KVM-capable runner image instead of a moving ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        id: android_sdk
        shell: bash
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee night-calendar-build.log
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify NIGHT CORE diagnostics
        run: python3 -m unittest discover -s scripts -p 'test_ci_diagnose.py' -v
      - name: Build debug APK and test
        id: android_build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee -a night-calendar-build.log
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM device status:"
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM unavailable on this runner; emulator smoke test cannot be trusted."
            exit 1
          fi
      - name: Android emulator install and launch smoke test
        id: emulator_smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-boot-timeout: 600
          script: |
            set -eu
            apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
            pkg=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test -n "$pkg"
            adb install "$apk"
            adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof "$pkg"
            adb shell am force-stop "$pkg"
            adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell pidof "$pkg"
      - name: Classify build result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ] && [ "${{ steps.emulator_smoke.outcome }}" = "success" ]; then
            python3 scripts/ci_diagnose.py --log night-calendar-build.log --out night-core-diagnosis.json --success
          else
            echo 'CI gate failed or skipped; emulator outcome: ${{ steps.emulator_smoke.outcome }}' >> night-calendar-build.log
            python3 scripts/ci_diagnose.py --log night-calendar-build.log --out night-core-diagnosis.json
          fi
          cat night-core-diagnosis.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-core-build-diagnostics
          path: |
            night-calendar-build.log
            night-core-diagnosis.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: night-calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
